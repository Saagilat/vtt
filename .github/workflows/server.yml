name: server

# CI по путям (docs/projects.md, правило 4): правка в server/ запускает только его тесты,
# а правка в contract/ — ещё и его: валидатор читает те же файлы, что и Python в разметчике.
on:
  push:
    paths:
      - 'server/**'
      - 'contract/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'contract/**'
      - '.github/workflows/server.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Драйвер базы — чистый Go: сборка и тесты идут без cgo, бинарь статический.
      CGO_ENABLED: '0'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - name: Форматирование — gofmt не находит, что менять
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "не отформатировано (нужно gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi
      - name: Разбор — go vet
        run: go vet ./...
      - name: Тесты — контракт, пределы, API и база
        run: go test ./...
      - name: Сборка — без cgo, статический бинарь
        run: |
          go build -trimpath -o vtt ./cmd/vtt
          file vtt | grep -q 'statically linked'
      - name: Аккаунт и база — CLI заводит человека, база открывается
        run: |
          db=$RUNNER_TEMP/vtt.db
          printf 'пароль\n' | ./vtt --db=$db --create-account=alice
          ./vtt --db=$db --mode=game --schema=../contract/annotation.v1.schema.json
      - name: Скелет отвечает — оба режима стартуют, незнакомый отвергается
        run: |
          ./vtt --version
          ./vtt --mode=game --schema=../contract/annotation.v1.schema.json
          ./vtt --mode=admin --schema=../contract/annotation.v1.schema.json
          if ./vtt --mode=nope; then
            echo "незнакомый режим не отвергнут"
            exit 1
          fi
