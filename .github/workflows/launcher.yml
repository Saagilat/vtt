name: launcher

# CI по путям (docs/projects.md, правило 4): правка в launcher/ запускает только его.
on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
          cache-dependency-path: launcher/go.sum
      - name: Окно требует GL и X11 — заголовки для cgo
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Форматирование — gofmt не находит, что менять
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "не отформатировано (нужно gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi
      - name: Разбор — go vet
        run: go vet ./...
      - name: Тесты — движок без окна, окно только собирается
        run: go test ./...
      - name: Сборка под Linux — cgo, окно
        run: >-
          CGO_ENABLED=1 go build -trimpath
          -ldflags "-X main.version=${GITHUB_REF_NAME}"
          -o vtt-launcher ./cmd/vtt-launcher
      - name: Мингер для кросс-сборки под Windows
        run: sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Сборка под Windows — cgo и mingw
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" \
            -o vtt-launcher.exe ./cmd/vtt-launcher
          ls -l vtt-launcher.exe
