name: docs

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ссылки — цель есть, якорь в цели есть
        run: python3 scripts/check_links.py
      - name: Markdown — пустые строки, колонки таблиц, длина строк, следы истории и номеров
        run: python3 scripts/lint_md.py
      - name: Границы проектов — импорты, манифесты, список папок
        run: python3 scripts/check_boundaries.py
