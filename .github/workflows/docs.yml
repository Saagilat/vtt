name: docs

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ссылки — цель есть, номер из подписи в цели есть
        run: python3 scripts/check_links.py
      - name: Номера — определены и не дублируются
        run: python3 scripts/check_ids.py
      - name: Markdown — двойные пустые строки, колонки таблиц
        run: python3 scripts/lint_md.py
