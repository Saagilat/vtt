[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vtt-prep"
description = "Подготовка карты: формат, поля, предел размера, стирание печатной сетки"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["version"]
dependencies = []

[project.scripts]
vtt-prep = "vtt_prep.cli:main"

[tool.setuptools]
packages = ["vtt_prep"]

[tool.setuptools.dynamic]
version = { attr = "vtt_prep.__version__" }
