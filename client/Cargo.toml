[package]
name = "vtt-client"
version = "0.1.0"
edition = "2021"
description = "Клиент виртуального стола: карта, сетка, фишки"
license = "MIT"

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
eframe = "0.37"
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = { version = "2", features = ["json"] }
